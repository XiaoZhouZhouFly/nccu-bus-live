<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>政大校園公車即時動態</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 手機版除錯控制台 (確認穩定後可加上註解隱藏) -->
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>

    <style>
        body { font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; background-color: #f3f4f6; }
        
        .route-axis {
            position: relative;
            margin-left: 1.25rem;
            margin-top: 1.25rem;
            margin-bottom: 2.5rem;
            border-left-width: 5px;
            border-left-style: solid;
        }

        .axis-out-1 { border-color: #3b82f6; }
        .axis-in-1 { border-color: #93c5fd; }
        .axis-out-2 { border-color: #10b981; }
        .axis-in-2 { border-color: #6ee7b7; }
        .axis-out-3 { border-color: #f59e0b; }
        .axis-in-3 { border-color: #fcd34d; }

        /* 政大3路 達賢分支虛線軌道 */
        .branch-track-3 {
            position: absolute;
            left: -5px;
            width: 28px;
            border-top: 3px dashed #f59e0b;
            border-right: 4px dashed #f59e0b;
            border-bottom: 3px dashed #f59e0b;
            border-top-right-radius: 10px;
            border-bottom-right-radius: 10px;
            pointer-events: none;
            z-index: 1;
        }

        /* 放大站點圓圈 */
        .stop-node {
            position: absolute;
            left: -12.5px;
            width: 20px;
            height: 20px;
            background-color: white;
            border-radius: 50%;
            transform: translateY(-50%);
            z-index: 10;
        }
        
        .node-out-1 { border: 5px solid #3b82f6; }
        .node-in-1 { border: 5px solid #60a5fa; }
        .node-out-2 { border: 5px solid #10b981; }
        .node-in-2 { border: 5px solid #34d399; }
        .node-out-3 { border: 5px solid #f59e0b; }
        .node-in-3 { border: 5px solid #fbbf24; }
        .node-branch-3 { border: 4px solid #d97706; background-color: #fffbeb; }

        /* 放大文字資訊框 */
        .stop-info {
            position: absolute;
            left: 16px;
            transform: translateY(-50%);
            width: max-content;
            display: flex;
            flex-direction: column;
            line-height: 1.25;
            background-color: rgba(255,255,255,0.9);
            padding: 3px 6px;
            border-radius: 6px;
            z-index: 5;
        }

        /* 放大公車圖示 */
        .bus-marker {
            position: absolute;
            left: -18.5px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 0.95rem;
            z-index: 20;
            border: 2.5px solid white;
            box-shadow: 0 3px 6px rgba(0,0,0,0.25);
            transition: top 0.5s ease-in-out, left 0.5s ease-in-out;
            transform: translateY(-50%);
        }

        .bus-out-1 { background-color: #2563eb; color: white; }
        .bus-out-2 { background-color: #059669; color: white; }
        .bus-out-3 { background-color: #d97706; color: white; }
        .bus-in-1 { background-color: #bfdbfe; color: #1e3a8a; }
        .bus-in-2 { background-color: #a7f3d0; color: #064e3b; }
        .bus-in-3 { background-color: #fde68a; color: #78350f; }

        .loading-spin { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body class="pb-12">

    <div class="max-w-md mx-auto bg-white min-h-screen shadow-md">
        <div class="sticky top-0 bg-white/95 backdrop-blur-sm p-4 border-b border-gray-200 z-50 flex justify-between items-center shadow-sm">
            <h1 class="font-bold text-gray-800 text-xl flex items-center gap-2">
                🚌 校園公車即時動態
            </h1>
            <div class="flex items-center gap-2">
                <span id="sync-icon" class="text-gray-400 text-sm">🔄</span>
                <div id="clock" class="font-mono text-gray-700 bg-gray-100 px-2.5 py-1 rounded text-base font-semibold">--:--:--</div>
            </div>
        </div>
        <div class="p-3.5 space-y-6" id="routes-container"></div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = 
                String(now.getHours()).padStart(2,'0') + ':' + 
                String(now.getMinutes()).padStart(2,'0') + ':' + 
                String(now.getSeconds()).padStart(2,'0');
        }
        updateClock();
        setInterval(updateClock, 1000);

        const routeConfig = {
            1: {
                name: "政大1路", height: "240px", color: 1, rid: 16446,
                outbound: { dest: "往好漢坡", stops: [ 
                    { name: "行政大樓", id: "tte127374" }, { name: "百年樓", id: "tte129747" }, 
                    { name: "藝文中心", id: "tte129748" }, { name: "好漢坡", id: "tte127375" } ] },
                inbound: { dest: "往行政大樓", stops: [ 
                    { name: "好漢坡", id: "tte127373" }, { name: "藝文中心", id: "tte181244" }, 
                    { name: "百年樓", id: "tte181245" }, { name: "行政大樓", id: "tte181246" } ] }
            },
            2: {
                name: "政大2路", height: "540px", color: 2, rid: 16447,
                outbound: { dest: "往六期運動場", stops: [ 
                    { name: "行政大樓", id: "tte129749" }, { name: "百年樓", id: "tte129750" }, 
                    { name: "藝文中心", id: "tte127378" }, { name: "好漢坡", id: "tte127376" }, 
                    { name: "自強一二三舍", id: "tte215373" }, { name: "山居學習中心", id: "tte181248" }, 
                    { name: "自強十舍", id: "tte205983" }, { name: "研創中心", id: "tte205507" }, 
                    { name: "六期運動場", id: "tte205506" } ] },
                inbound: { dest: "往行政大樓", stops: [ 
                    { name: "研創中心", id: "tte205508" }, { name: "好漢坡", id: "tte181249" }, 
                    { name: "藝文中心", id: "tte181250" }, { name: "百年樓", id: "tte181251" }, 
                    { name: "行政大樓", id: "tte181252" } ] }
            },
            3: {
                name: "政大3路", height: "420px", color: 3, rid: 16448,
                outbound: { dest: "往山居學習中心", stops: [ 
                    { name: "行政大樓", id: "tte127380" }, { name: "百年樓", id: "tte129751" }, 
                    { name: "藝文中心", id: "tte205512" }, { name: "好漢坡", id: "tte127381" }, 
                    { name: "自強一二三舍", id: "tte215374" }, { name: "山居學習中心", id: "tte194576" } ] },
                inbound: { 
                    dest: "往行政大樓 (虛線為達賢分支)", 
                    hasBranch: true,
                    branchStart: 42, // 從百年樓 (42%) 分出
                    branchEnd: 100,  // 接回行政大樓 (100%)
                    stops: [ 
                        { name: "好漢坡", id: "tte181259", pos: 0 }, 
                        { name: "藝文中心", id: "tte205513", pos: 21 }, 
                        { name: "百年樓", id: "tte181261", pos: 42 }, 
                        { name: "風雩樓", id: "tte204875", pos: 64, isBranch: true }, 
                        { name: "達賢圖書館", id: "tte205534", pos: 82, isBranch: true }, 
                        { name: "行政大樓", id: "tte205535", pos: 100 } 
                    ] 
                }
            }
        };

        function initUI() {
            const container = document.getElementById('routes-container');
            let html = "";

            [1, 2, 3].forEach(routeId => {
                const config = routeConfig[routeId];
                const generateDirectionHtml = (dirType, dirConfig, isOutbound) => {
                    const axisClass = `axis-${isOutbound ? 'out' : 'in'}-${config.color}`;
                    const baseNodeClass = `node-${isOutbound ? 'out' : 'in'}-${config.color}`;
                    const titleColor = isOutbound ? 'text-gray-800' : 'text-gray-600';

                    // 若為 3 路返程，繪製右側虛線分支軌道
                    let branchTrackHtml = "";
                    if (dirConfig.hasBranch) {
                        const topPct = dirConfig.branchStart;
                        const heightPct = dirConfig.branchEnd - dirConfig.branchStart;
                        branchTrackHtml = `<div class="branch-track-3" style="top: ${topPct}%; height: ${heightPct}%;"></div>`;
                    }

                    let stopsHtml = dirConfig.stops.map((stop, index) => {
                        const percent = stop.pos !== undefined ? stop.pos : (index / (dirConfig.stops.length - 1)) * 100;
                        const isBranch = stop.isBranch === true;
                        
                        // 分支站點往右偏移 26px，對齊虛線軌道
                        const nodeLeftStyle = isBranch ? 'left: 13.5px;' : '';
                        const infoLeftStyle = isBranch ? 'left: 42px;' : '';
                        const nodeClass = isBranch ? 'node-branch-3' : baseNodeClass;
                        const badgeHtml = isBranch ? `<span class="text-[10px] bg-amber-100 text-amber-800 px-1 rounded font-normal ml-1">支線</span>` : '';

                        return `
                            <div class="stop-node ${nodeClass}" style="top: ${percent}%; ${nodeLeftStyle}"></div>
                            <div class="stop-info" style="top: ${percent}%; ${infoLeftStyle}">
                                <span class="font-bold text-gray-800 text-[15px] flex items-center">${stop.name}${badgeHtml}</span>
                                <span class="text-xs text-gray-400 mt-0.5 font-bold transition-colors duration-300" id="status-${stop.id}">連線中...</span>
                                <span class="text-[11px] text-blue-600 font-mono font-semibold hidden mt-0.5" id="plate-${stop.id}"></span>
                            </div>
                        `;
                    }).join("");

                    return `
                        <div class="flex-1 min-w-0">
                            <div class="text-sm font-bold ${titleColor} mb-2 flex flex-col">
                                <span>${isOutbound ? '去程' : '返程'}</span>
                                <span class="text-xs font-normal text-gray-400 truncate">${dirConfig.dest}</span>
                            </div>
                            <div class="route-axis ${axisClass}" style="height: ${config.height};" id="axis-${routeId}-${dirType}">
                                ${branchTrackHtml}
                                ${stopsHtml}
                            </div>
                        </div>
                    `;
                };

                html += `
                    <div class="bg-white rounded-2xl p-4 border border-gray-200 shadow-sm mb-4">
                        <div class="font-extrabold text-xl text-gray-800 mb-4 border-b border-gray-100 pb-2.5">
                            ${config.name}
                        </div>
                        <div class="flex gap-3 w-full">
                            ${generateDirectionHtml('out', config.outbound, true)}
                            ${generateDirectionHtml('in', config.inbound, false)}
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function safeParseStatus(tdElement) {
            let statusText = "無資料";
            let plateText = "";
            try {
                const fontTag = tdElement.querySelector('font');
                if (fontTag) plateText = fontTag.innerText.trim();

                for (let node of tdElement.childNodes) {
                    if (node.nodeType === 3) { 
                        let val = node.nodeValue.trim();
                        if (val) {
                            statusText = val;
                            break;
                        }
                    }
                }
            } catch (e) {
                console.warn("解析節點異常:", e);
            }
            return { statusText, plateText };
        }

        async function fetchAllRoutesData() {
            const syncIcon = document.getElementById('sync-icon');
            syncIcon.classList.add('loading-spin');

            // 已填入你的專屬 Cloudflare Worker 網址（移除尾端斜線避免雙斜線異常）
            const CF_WORKER_URL = "https://nccu-bus.qoo3308.workers.dev";

            for (let routeId of [1, 2, 3]) {
                const config = routeConfig[routeId];
                const targetUrl = `http://nccu.5284.com.tw/MQS/route.jsp?rid=${config.rid}`;
                const proxyUrl = `${CF_WORKER_URL}?url=${encodeURIComponent(targetUrl)}&t=${Date.now()}`;
                
                try {
                    const response = await fetch(proxyUrl);
                    if (!response.ok) throw new Error(`CF 代理請求失敗，代碼: ${response.status}`);
                    
                    const htmlText = await response.text(); 
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(htmlText, 'text/html');
                    
                    document.getElementById(`axis-${routeId}-out`).querySelectorAll('.bus-marker').forEach(b => b.remove());
                    document.getElementById(`axis-${routeId}-in`).querySelectorAll('.bus-marker').forEach(b => b.remove());

                    const processDirection = (dirConfig, dirType) => {
                        dirConfig.stops.forEach((stop, index) => {
                            const tdElement = doc.getElementById(stop.id);
                            if (tdElement) {
                                const { statusText, plateText } = safeParseStatus(tdElement);

                                const statusEl = document.getElementById(`status-${stop.id}`);
                                statusEl.innerText = statusText;
                                
                                if (statusText.includes('將到站')) {
                                    statusEl.className = "text-xs mt-0.5 font-extrabold text-red-500 transition-colors duration-300";
                                } else if (statusText.includes('分')) {
                                    statusEl.className = "text-xs mt-0.5 font-bold text-green-600 transition-colors duration-300";
                                } else {
                                    statusEl.className = "text-xs mt-0.5 font-bold text-gray-400 transition-colors duration-300";
                                }

                                const plateEl = document.getElementById(`plate-${stop.id}`);
                                if (plateText) {
                                    plateEl.innerText = plateText;
                                    plateEl.classList.remove('hidden');
                                } else {
                                    plateEl.classList.add('hidden');
                                }

                                if (statusText.includes('將到站') || (statusText.includes('未發車') && plateText !== "")) {
                                    const percent = stop.pos !== undefined ? stop.pos : (index / (dirConfig.stops.length - 1)) * 100;
                                    const bus = document.createElement('div');
                                    bus.className = `bus-marker bus-${dirType}-${config.color}`;
                                    bus.style.top = `${percent}%`;
                                    // 若公車位於達賢支線站點，將公車圓圈同步偏移至虛線軌道上
                                    if (stop.isBranch) {
                                        bus.style.left = '7.5px';
                                    }
                                    bus.innerText = routeId;
                                    document.getElementById(`axis-${routeId}-${dirType}`).appendChild(bus);
                                }
                            }
                        });
                    };

                    processDirection(config.outbound, 'out');
                    processDirection(config.inbound, 'in');

                } catch (error) {
                    console.error(`路線 ${routeId} 同步失敗:`, error);
                }
            }
            syncIcon.classList.remove('loading-spin');
        }

        initUI();
        fetchAllRoutesData();
        setInterval(fetchAllRoutesData, 15000);
    </script>
</body>
</html>
