<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>政大校園公車動態系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; background-color: #f3f4f6; }
        
        .route-axis {
            position: relative;
            margin-left: 1.5rem;
            margin-top: 1rem;
            margin-bottom: 2rem;
            border-left-width: 4px;
            border-left-style: solid;
        }

        .axis-out-1 { border-color: #3b82f6; }
        .axis-in-1 { border-color: #bfdbfe; }
        .axis-out-2 { border-color: #10b981; }
        .axis-in-2 { border-color: #a7f3d0; }
        .axis-out-3 { border-color: #f59e0b; }
        .axis-in-3 { border-color: #fde68a; }

        .stop-node {
            position: absolute;
            left: -10px;
            width: 16px;
            height: 16px;
            background-color: white;
            border-radius: 50%;
            transform: translateY(-50%);
            z-index: 10;
        }
        
        .node-out-1 { border: 4px solid #3b82f6; }
        .node-in-1 { border: 4px solid #93c5fd; }
        .node-out-2 { border: 4px solid #10b981; }
        .node-in-2 { border: 4px solid #6ee7b7; }
        .node-out-3 { border: 4px solid #f59e0b; }
        .node-in-3 { border: 4px solid #fcd34d; }

        .stop-info {
            position: absolute;
            left: 16px;
            transform: translateY(-50%);
            width: max-content;
            display: flex;
            flex-direction: column;
            line-height: 1.2;
            background-color: rgba(255,255,255,0.85);
            padding: 2px 4px;
            border-radius: 4px;
            z-index: 5;
        }

        .bus-marker {
            position: absolute;
            left: -16px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.85rem;
            z-index: 20;
            border: 2px solid white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: top 0.5s ease-in-out;
            transform: translateY(-50%);
        }

        .bus-out-1 { background-color: #2563eb; color: white; }
        .bus-out-2 { background-color: #059669; color: white; }
        .bus-out-3 { background-color: #d97706; color: white; }
        .bus-in-1 { background-color: #bfdbfe; color: #1e3a8a; }
        .bus-in-2 { background-color: #a7f3d0; color: #064e3b; }
        .bus-in-3 { background-color: #fde68a; color: #78350f; }

        .loading-spin { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body class="pb-10">

    <div class="max-w-md mx-auto bg-white min-h-screen shadow-md">
        <div class="sticky top-0 bg-white/95 backdrop-blur-sm p-4 border-b border-gray-200 z-50 flex justify-between items-center shadow-sm">
            <h1 class="font-bold text-gray-800 text-lg flex items-center gap-2">
                🚌 校園公車即時動態
            </h1>
            <div class="flex items-center gap-2">
                <span id="sync-icon" class="text-gray-400 text-xs">🔄</span>
                <div id="clock" class="font-mono text-gray-600 bg-gray-100 px-2 py-1 rounded text-sm">--:--:--</div>
            </div>
        </div>
        <div class="p-3 space-y-6" id="routes-container"></div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = 
                String(now.getHours()).padStart(2,'0') + ':' + 
                String(now.getMinutes()).padStart(2,'0') + ':' + 
                String(now.getSeconds()).padStart(2,'0');
        }
        updateClock();
        setInterval(updateClock, 1000);

        const routeConfig = {
            1: {
                name: "政大1路", height: "200px", color: 1, rid: 16446,
                outbound: { dest: "往好漢坡", stops: [ 
                    { name: "行政大樓", id: "tte127374" }, { name: "百年樓", id: "tte129747" }, 
                    { name: "藝文中心", id: "tte129748" }, { name: "好漢坡", id: "tte127375" } ] },
                inbound: { dest: "往行政大樓", stops: [ 
                    { name: "好漢坡", id: "tte127373" }, { name: "藝文中心", id: "tte181244" }, 
                    { name: "百年樓", id: "tte181245" }, { name: "行政大樓", id: "tte181246" } ] }
            },
            2: {
                name: "政大2路", height: "450px", color: 2, rid: 16447,
                outbound: { dest: "往六期運動場", stops: [ 
                    { name: "行政大樓", id: "tte129749" }, { name: "百年樓", id: "tte129750" }, 
                    { name: "藝文中心", id: "tte127378" }, { name: "好漢坡", id: "tte127376" }, 
                    { name: "自強一二三舍", id: "tte215373" }, { name: "山居學習中心", id: "tte181248" }, 
                    { name: "自強十舍", id: "tte205983" }, { name: "研創中心", id: "tte205507" }, 
                    { name: "六期運動場", id: "tte205506" } ] },
                inbound: { dest: "往行政大樓", stops: [ 
                    { name: "研創中心", id: "tte205508" }, { name: "好漢坡", id: "tte181249" }, 
                    { name: "藝文中心", id: "tte181250" }, { name: "百年樓", id: "tte181251" }, 
                    { name: "行政大樓", id: "tte181252" } ] }
            },
            3: {
                name: "政大3路", height: "350px", color: 3, rid: 16448,
                outbound: { dest: "往山居學習中心", stops: [ 
                    { name: "行政大樓", id: "tte127380" }, { name: "百年樓", id: "tte129751" }, 
                    { name: "藝文中心", id: "tte205512" }, { name: "好漢坡", id: "tte127381" }, 
                    { name: "自強一二三舍", id: "tte215374" }, { name: "山居學習中心", id: "tte194576" } ] },
                inbound: { dest: "往行政大樓", stops: [ 
                    { name: "好漢坡", id: "tte181259" }, { name: "藝文中心", id: "tte205513" }, 
                    { name: "百年樓", id: "tte181261" }, { name: "行政大樓(風雩樓)", id: "tte204875" }, 
                    { name: "達賢圖書館", id: "tte205534" }, { name: "行政大樓", id: "tte205535" } ] }
            }
        };

        function initUI() {
            const container = document.getElementById('routes-container');
            let html = "";

            [1, 2, 3].forEach(routeId => {
                const config = routeConfig[routeId];
                const generateDirectionHtml = (dirType, dirConfig, isOutbound) => {
                    const axisClass = `axis-${isOutbound ? 'out' : 'in'}-${config.color}`;
                    const nodeClass = `node-${isOutbound ? 'out' : 'in'}-${config.color}`;
                    const titleColor = isOutbound ? 'text-gray-800' : 'text-gray-500';

                    let stopsHtml = dirConfig.stops.map((stop, index) => {
                        const percent = (index / (dirConfig.stops.length - 1)) * 100;
                        return `
                            <div class="stop-node ${nodeClass}" style="top: ${percent}%;"></div>
                            <div class="stop-info" style="top: ${percent}%;">
                                <span class="font-bold text-gray-700 text-xs">${stop.name}</span>
                                <span class="text-[10px] text-gray-400 mt-0.5 font-bold transition-colors duration-300" id="status-${stop.id}">連線中...</span>
                                <span class="text-[9px] text-blue-600 font-mono hidden" id="plate-${stop.id}"></span>
                            </div>
                        `;
                    }).join("");

                    return `
                        <div class="flex-1">
                            <div class="text-xs font-bold ${titleColor} mb-2 flex flex-col">
                                <span>${isOutbound ? '去程' : '返程'}</span>
                                <span class="text-[10px] font-normal text-gray-400">${dirConfig.dest}</span>
                            </div>
                            <div class="route-axis ${axisClass}" style="height: ${config.height};" id="axis-${routeId}-${dirType}">
                                ${stopsHtml}
                            </div>
                        </div>
                    `;
                };

                html += `
                    <div class="bg-white rounded-xl p-4 border border-gray-100 shadow-sm mb-4">
                        <div class="font-bold text-lg text-gray-800 mb-4 border-b border-gray-50 pb-2">
                            ${config.name}
                        </div>
                        <div class="flex gap-4 w-full">
                            ${generateDirectionHtml('out', config.outbound, true)}
                            ${generateDirectionHtml('in', config.inbound, false)}
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function safeParseStatus(tdElement) {
            let statusText = "無資料";
            let plateText = "";
            try {
                const fontTag = tdElement.querySelector('font');
                if (fontTag) plateText = fontTag.innerText.trim();

                for (let node of tdElement.childNodes) {
                    if (node.nodeType === 3) { 
                        let val = node.nodeValue.trim();
                        if (val) {
                            statusText = val;
                            break;
                        }
                    }
                }
            } catch (e) {
                console.warn("解析節點異常:", e);
            }
            return { statusText, plateText };
        }

        async function fetchAllRoutesData() {
            const syncIcon = document.getElementById('sync-icon');
            syncIcon.classList.add('loading-spin');

            for (let routeId of [1, 2, 3]) {
                const config = routeConfig[routeId];
                const targetUrl = `http://nccu.5284.com.tw/MQS/route.jsp?rid=${config.rid}&t=${Date.now()}`;
                
                // GitHub Pages 專用的標準 API 抓取寫法
                const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;
                
                try {
                    const response = await fetch(proxyUrl);
                    if (!response.ok) throw new Error("網路請求失敗");
                    
                    const data = await response.json();
                    const htmlText = data.contents; 
                    
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(htmlText, 'text/html');
                    
                    document.getElementById(`axis-${routeId}-out`).querySelectorAll('.bus-marker').forEach(b => b.remove());
                    document.getElementById(`axis-${routeId}-in`).querySelectorAll('.bus-marker').forEach(b => b.remove());

                    const processDirection = (dirConfig, dirType) => {
                        dirConfig.stops.forEach((stop, index) => {
                            const tdElement = doc.getElementById(stop.id);
                            if (tdElement) {
                                const { statusText, plateText } = safeParseStatus(tdElement);

                                const statusEl = document.getElementById(`status-${stop.id}`);
                                statusEl.innerText = statusText;
                                
                                if (statusText.includes('將到站')) {
                                    statusEl.className = "text-[10px] mt-0.5 font-bold text-red-500 transition-colors duration-300";
                                } else if (statusText.includes('分')) {
                                    statusEl.className = "text-[10px] mt-0.5 font-bold text-green-600 transition-colors duration-300";
                                } else {
                                    statusEl.className = "text-[10px] mt-0.5 font-bold text-gray-400 transition-colors duration-300";
                                }

                                const plateEl = document.getElementById(`plate-${stop.id}`);
                                if (plateText) {
                                    plateEl.innerText = plateText;
                                    plateEl.classList.remove('hidden');
                                } else {
                                    plateEl.classList.add('hidden');
                                }

                                if (statusText.includes('將到站') || (statusText.includes('未發車') && plateText !== "")) {
                                    const percent = (index / (dirConfig.stops.length - 1)) * 100;
                                    const bus = document.createElement('div');
                                    bus.className = `bus-marker bus-${dirType}-${config.color}`;
                                    bus.style.top = `${percent}%`;
                                    bus.innerText = routeId;
                                    document.getElementById(`axis-${routeId}-${dirType}`).appendChild(bus);
                                }
                            }
                        });
                    };

                    processDirection(config.outbound, 'out');
                    processDirection(config.inbound, 'in');

                } catch (error) {
                    console.error(`路線 ${routeId} 同步失敗:`, error);
                }
            }
            syncIcon.classList.remove('loading-spin');
        }

        initUI();
        fetchAllRoutesData();
        setInterval(fetchAllRoutesData, 15000);
    </script>
</body>
</html>
